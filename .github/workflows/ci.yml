name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    concurrency:
      group: polishkit-production
      cancel-in-progress: true

    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /opt/polish-kit
          git fetch origin main
          git reset --hard origin/main
          pnpm install --frozen-lockfile
          pnpm run build
          sudo systemctl restart polishkit
          for attempt in {1..10}; do
            if sudo systemctl is-active --quiet polishkit && curl --fail --silent --show-error http://localhost:3000/health; then
              exit 0
            fi
            sleep 1
          done
          sudo systemctl status polishkit --no-pager
          sudo journalctl -u polishkit -n 80 --no-pager
          exit 1
          EOF

      - name: Verify public health endpoint
        run: curl --fail --silent --show-error https://polish.zz-love-taizi.link/health
